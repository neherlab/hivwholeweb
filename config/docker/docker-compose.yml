version: '3.7'

services:
  hivwholeweb-flask:
    container_name: hivwholeweb-flask
    image: hivwholeweb-flask
    build:
      context: ../..
      dockerfile: config/docker/flask/Dockerfile
      args:
      - UID=${UID}
      - GID=${GID}
      - USER=${USER}
      - GROUP=${GROUP}
    volumes:
      - ../../.volumes/flask/tmp:/tmp
      - ../../../hivwholeweb_data:/app/app/hiv/static/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - UID=${UID}
      - GID=${GID}
      - USER=${USER}
      - GROUP=${GROUP}
      - COLORTERM=truecolor
      - TERM=xterm-truecolor
    restart: always
    init: true
    tty: true

  hivwholeweb-nginx:
    depends_on:
      - hivwholeweb-flask
    container_name: hivwholeweb-nginx
    image: hivwholeweb-nginx
    build:
      context: ../..
      dockerfile: config/docker/nginx/Dockerfile
      args:
      - UID=${UID}
      - GID=${GID}
      - USER=${USER}
      - GROUP=${GROUP}
    volumes:
      - ../../.volumes/nginx/cache:/var/cache/nginx
      - ../../.volumes/nginx/logs:/var/lib/nginx/logs
      - ../../.volumes/nginx/tmp:/tmp
      - ../../html:/html
      - /etc/ssl/bz-rgrn01-vsl01.bioz.unibas.ch.fullchain.pem:/etc/ssl/fullchain.pem:ro
      - /etc/ssl/bz-rgrn01-vsl01.bioz.unibas.ch.privkey.pem:/etc/ssl/privkey.pem:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 80:8080
      - 443:44443
    environment:
      - UID=${UID}
      - GID=${GID}
      - USER=${USER}
      - GROUP=${GROUP}
      - COLORTERM=truecolor
      - TERM=xterm-truecolor
    restart: always
    init: true
    tty: true
    user: '${UID}'
