worker_processes auto;

events {
  worker_connections 1024;
  multi_accept on;
}

# Allows to run nginx as non-root
pid /tmp/nginx.pid;


http {
  sendfile on;

  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;

  keepalive_timeout 120;

  include include/mime-types.conf;
  default_type application/octet-stream;

  server {
    server_name _;
    listen 8080;

    return 301 https://$host$request_uri;
  }

  server {
    server_name _;
    listen 44443 ssl http2;

    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!LOW:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4:!EXP:!SRP:!DSS;
    ssl_prefer_server_ciphers off;
    proxy_ssl_session_reuse on;

    include include/security-headers.conf;

    include include/compression-settings.conf;

    location / {
      root /html;
      try_files $uri @flask;
    }

    location @flask {
      include include/uwsgi_params.conf;
      uwsgi_pass hivwholeweb-flask:5000;
    }
  }
}
